name: Build Droidian packages

on:
  push:
    paths:
      - projects.json
      - patches/**
      - patches-additional/**
      - project-scripts/**
      - project-scripts-additional/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      projects:
        description: Comma-separated targets; append -additional for additional builds, empty means all base/additional=true builds
        required: false
        type: string

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate configuration
        run: ./scripts/validate.sh

      - id: plan
        name: Generate project matrix
        env:
          REQUESTED: ${{ inputs.projects || '' }}
        run: |
          matrix="$(./scripts/ci-plan.sh "$REQUESTED")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<< "$matrix")" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: Build ${{ matrix.name }}${{ matrix.additional && ' [additional]' || '' }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
      options: ${{ matrix.container_options }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install build-system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq curl ca-certificates unzip

      - name: Verify container architecture
        env:
          EXPECTED_ARCH: ${{ matrix.architecture }}
        run: |
          actual="$(dpkg --print-architecture)"
          test "$actual" = "$EXPECTED_ARCH"

      - name: Resolve dependency artifacts
        if: matrix.has_dependencies
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDENCIES_JSON: ${{ toJSON(matrix.dependencies) }}
          DEPENDENCY_OUTPUT_ROOT: ${{ github.workspace }}/dependency-artifacts
        run: ./scripts/wait-for-dependencies.sh

      - name: Build project
        env:
          DEPENDENCY_OUTPUT_ROOT: ${{ github.workspace }}/dependency-artifacts
          BUILD_ADDITIONAL: ${{ matrix.additional }}
        run: |
          args=("${{ matrix.name }}")
          [[ "$BUILD_ADDITIONAL" == true ]] && args+=(--additional)
          ./scripts/build-project.sh "${args[@]}"

      - name: Upload project artifacts
        uses: actions/upload-artifact@v7
        with:
          name: project-${{ matrix.name }}${{ matrix.additional && '-additional' || '' }}
          path: dist/${{ matrix.name }}/${{ matrix.additional && 'additional' || 'base' }}/
          if-no-files-found: error
          retention-days: 1

  bundle:
    needs: [plan, build]
    if: always() && needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install bundle dependencies
        run: sudo apt-get update && sudo apt-get install -y jq curl unzip zip

      - id: bundle
        name: Create final bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX_JSON: ${{ needs.plan.outputs.matrix }}
        run: ./scripts/prepare-bundle.sh

      - name: Upload APT repository input
        if: steps.bundle.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apt-repo-input
          path: apt-repo-input/
          if-no-files-found: error
          retention-days: 1

      - name: Upload final ZIP
        if: steps.bundle.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: droidian-packages-arm64.zip
          archive: false
          if-no-files-found: error
