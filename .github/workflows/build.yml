name: Build Droidian packages

on:
  push:
    paths:
      - projects.json
      - compose.yaml
      - patches/**
      - scripts/**
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      projects:
        description: Comma-separated target project names; empty means all enabled projects
        required: false
        type: string

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.projects.outputs.matrix }}
      count: ${{ steps.projects.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate configuration
        run: ./scripts/validate.sh
      - id: projects
        name: Generate dependency-aware targets
        env:
          REQUESTED: ${{ inputs.projects || '' }}
        run: |
          mapfile -t targets < <(./scripts/list-targets.sh "$REQUESTED")
          matrix="$(printf '%s\n' "${targets[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | {target: .}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=${#targets[@]}" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    if: needs.matrix.outputs.count != '0'
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install host tools
        run: sudo apt-get update && sudo apt-get install -y podman podman-compose jq
      - name: Build ${{ matrix.target }} and dependencies
        run: ./scripts/build.sh "${{ matrix.target }}"
      - name: Upload produced packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: partial-${{ matrix.target }}
          path: dist/
          if-no-files-found: ignore
          retention-days: 1

  bundle:
    needs: [matrix, build]
    if: always() && needs.matrix.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - name: Download produced packages
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: partial-*
          path: collected
          merge-multiple: true

      - name: Create ZIP
        id: zip
        run: |
          if [[ ! -d collected ]] || ! find collected -type f -print -quit | grep -q .; then
            echo "No package artifacts were produced."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mv collected droidian-packages-arm64
          zip -r droidian-packages-arm64.zip droidian-packages-arm64
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Upload APT repository input
        if: steps.zip.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: apt-repo-input
          path: droidian-packages-arm64/**/*.deb
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload final ZIP
        if: steps.zip.outputs.created == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: droidian-packages-arm64
          path: droidian-packages-arm64.zip
          archive: false
          if-no-files-found: error
